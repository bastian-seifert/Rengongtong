[project]
name = "rengongtong"
dynamic = ["version"]
description = "Réngōng tóng (人工童) — A local, persistent Agentic Tamagotchi on SmolLM2-135M"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Bastian Seifert" }]
dependencies = [
    "unsloth>=2026.4.0",
    "torch>=2.5.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "peft>=0.14",
    "bitsandbytes>=0.45",
    "transformers>=4.47",
    "trl>=0.14",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[project.urls]
repository = "https://github.com/bastian/rengongtong"
documentation = "https://github.com/bastian/rengongtong"

[tool.setuptools.dynamic]
version = { attr = "rengongtong.__version__" }

[tool.setuptools.packages.find]
include = ["rengongtong*"]

[project.scripts]
rengongtong = "rengongtong.cli:app"
