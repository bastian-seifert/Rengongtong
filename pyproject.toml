[project]
name = "rengongtong"
version = "0.1.0"
description = "Réngōng tóng (人工童) — A local, persistent Agentic Tamagotchi on SmolLM2-135M"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Bastian Seifert" }]
dependencies = [
    "unsloth>=2026.4.0",
    "torch>=2.5.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "peft>=0.14",
    "bitsandbytes>=0.45",
    "transformers>=4.47",
    "trl>=0.14",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[project.urls]
repository = "https://github.com/bastian/rengongtong"

[project.scripts]
rengongtong = "rengongtong.cli:app"

[tool.setuptools.packages.find]
include = ["rengongtong*"]

[tool.setuptools.package-data]
rengongtong = ["templates/**/*.j2"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
